name: Python Package CI/CD

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Check Python version
      run: python --version

    - name: Lint with flake8
      run: |
        flake8 InnoCaptcha --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 InnoCaptcha --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Simulate tests with pytest
      run: |
        pytest InnoCaptcha --maxfail=5 --disable-warnings -q || true
