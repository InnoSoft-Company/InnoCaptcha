[build-system]
requires = ["setuptools>=42", "wheel", "requests"]
build-backend = "setuptools.build_meta"

[project]
name = "InnoCaptcha"
version = "2.2.1"
description = "A professional, pluggable CAPTCHA library with image, math, and custom challenge types, token-based security, and multiple storage backends."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "InnoSoft Company", email = "midoghanam@hotmail.com" }
]
license = { file = "LICENSE" }
keywords = ["captcha", "image", "security", "bot-protection", "text-captcha", "math-captcha", 'audio-captcha', "plugin",]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = ["Pillow", "ultralytics", "scipy", "cryptography", "numpy", "opencv-python", "requests", "arabic-reshaper", "python-bidi", "pydub", "SpeechRecognition"]

[project.urls]
"Source Code" = "https://github.com/InnoSoft-Company/InnoCaptcha"
"Bug Tracker" = "https://github.com/InnoSoft-Company/InnoCaptcha/issues"
"EN_Documentation" = "https://github.com/InnoSoft-Company/InnoCaptcha#readme"
"AR_Documentation" = "https://github.com/InnoSoft-Company/InnoCaptcha/blob/main/README_AR.md"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.package-data]
InnoCaptcha = ["**/*"]

[project.scripts]
InnoCaptcha = "InnoCaptcha.cli:main"
